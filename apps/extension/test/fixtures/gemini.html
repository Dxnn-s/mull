<!doctype html>
<html lang="en" data-mull-site="gemini">
<head><meta charset="utf-8"><title>fixture: gemini composer</title>
<style>
  body { font-family: system-ui; margin: 40px; }
  .ql-editor { border: 1px solid #999; min-height: 40px; padding: 8px; width: 500px; }
  #log li { font-family: monospace; }
</style>
</head>
<body>
  <h1>fixture: gemini</h1>
  <rich-textarea>
    <div class="ql-editor" contenteditable="true" aria-label="Enter a prompt here"></div>
  </rich-textarea>
  <button type="button" class="send-button" aria-label="Send message">➤</button>
  <ul id="log"></ul>
  <script>
    const composer = document.querySelector('.ql-editor');
    const log = document.getElementById('log');
    function sendNow() {
      const text = composer.innerText.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.textContent = text;
      log.appendChild(li);
      composer.innerHTML = '';
    }
    composer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendNow(); }
    });
    document.querySelector('.send-button').addEventListener('click', sendNow);
  </script>
</body>
</html>
