<!doctype html>
<html lang="en" data-mull-site="chatgpt">
<head><meta charset="utf-8"><title>fixture: chatgpt composer</title>
<style>
  body { font-family: system-ui; margin: 40px; }
  #prompt-textarea { border: 1px solid #999; min-height: 40px; padding: 8px; width: 500px; }
  #log li { font-family: monospace; }
</style>
</head>
<body>
  <h1>fixture: chatgpt</h1>
  <form id="composer-form">
    <div id="prompt-textarea" class="ProseMirror" contenteditable="true" data-id="root"></div>
    <button type="button" data-testid="send-button">Send</button>
  </form>
  <ul id="log"></ul>
  <script>
    const composer = document.getElementById('prompt-textarea');
    const log = document.getElementById('log');
    function sendNow() {
      const text = composer.innerText.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.textContent = text;
      log.appendChild(li);
      composer.innerHTML = '';
    }
    composer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendNow(); }
    });
    document.querySelector('[data-testid="send-button"]').addEventListener('click', sendNow);
  </script>
</body>
</html>
