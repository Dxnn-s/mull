<!doctype html>
<html lang="en" data-mull-site="claude">
<head><meta charset="utf-8"><title>fixture: claude composer</title>
<style>
  body { font-family: system-ui; margin: 40px; }
  .ProseMirror { border: 1px solid #999; min-height: 40px; padding: 8px; width: 500px; }
  #log li { font-family: monospace; }
</style>
</head>
<body>
  <h1>fixture: claude</h1>
  <fieldset>
    <div class="ProseMirror" contenteditable="true" data-placeholder="How can Claude help you today?"></div>
    <button type="button" aria-label="Send message">→</button>
  </fieldset>
  <ul id="log"></ul>
  <script>
    const composer = document.querySelector('.ProseMirror');
    const log = document.getElementById('log');
    function sendNow() {
      const text = composer.innerText.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.textContent = text;
      log.appendChild(li);
      composer.innerHTML = '';
    }
    composer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendNow(); }
    });
    document.querySelector('[aria-label="Send message"]').addEventListener('click', sendNow);
  </script>
</body>
</html>
